<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f3ee">
<meta name="color-scheme" content="light dark">
<title>이벤트 스크랩북</title>
<style>
/* ================= 1. 색·테마 ================= */
:root{
  color-scheme: light;
  --bg:#f5f3ee; --surface:#ffffff; --surface-2:#eeebe3; --text:#1b2230; --muted:#596273; --line:#dcd6c9;
  --accent:#2456a6; --accent-soft:rgba(36,86,166,.12); --accent-ink:#ffffff;
  --danger:#b42318; --danger-soft:#fde7e4; --warn:#955800; --warn-soft:#fdf0d5; --ok:#17784a; --ok-soft:#dcf2e6; --sat:#1d4ed8;
  --radius:16px; --shadow:0 1px 2px rgba(20,24,33,.05),0 6px 18px rgba(20,24,33,.06);
  --nav-h:72px;
}
[data-theme="dark"]{
  color-scheme: dark;
  --bg:#11151b; --surface:#1a2029; --surface-2:#232b36; --text:#e8ecf2; --muted:#a3acbb; --line:#2f3845;
  --danger:#ff8f86; --danger-soft:rgba(255,110,100,.16); --warn:#ffc56e; --warn-soft:rgba(255,190,90,.14); --ok:#71dcaa; --ok-soft:rgba(90,210,150,.14); --sat:#8ab4ff;
  --shadow:0 1px 0 rgba(255,255,255,.03);
}

/* ================= 2. 기본 ================= */
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{font-size:19px;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic","맑은 고딕","Noto Sans KR","Segoe UI",Roboto,sans-serif;line-height:1.55;word-break:keep-all;overflow-wrap:anywhere;-webkit-tap-highlight-color:transparent}
body.locked{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{line-height:1.3}
.muted{color:var(--muted)}
.hint{color:var(--muted);font-size:.86rem;margin:.4rem 0}
.hint.center{text-align:center;margin:28px 0}
.req{color:var(--danger)}

/* ================= 3. 레이아웃 ================= */
.app{max-width:1000px;margin:0 auto;padding:0 16px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom))}
.topbar{position:sticky;top:0;z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(10px + env(safe-area-inset-top)) 0 10px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{font-size:1.6rem;line-height:1}
.brand h1{font-size:1.2rem;margin:0;letter-spacing:-.01em}
.today{margin:0;font-size:.8rem;color:var(--muted)}
.tabs{display:flex;gap:6px}
.tab{display:inline-flex;align-items:center;gap:6px;min-height:46px;padding:8px 14px;border:0;border-radius:12px;background:transparent;color:var(--muted);font-weight:700}
.tab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.tab:hover{background:var(--surface-2)}
.tab[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.tab-add,.tab-add:hover{background:var(--accent);color:var(--accent-ink)}
@media (max-width:760px){
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));justify-content:space-around;gap:0;box-shadow:0 -4px 16px rgba(0,0,0,.06)}
  .tab{flex:1;flex-direction:column;justify-content:center;gap:2px;min-height:58px;padding:6px 2px;font-size:.72rem}
  .tab svg{width:26px;height:26px}
  .tab-add{flex:none;width:62px;height:62px;min-height:62px;border-radius:50%;margin:-24px 6px 0;box-shadow:0 6px 16px rgba(0,0,0,.2)}
  .tab-add svg{width:30px;height:30px;stroke-width:2.6}
  .tab-add span{display:none}
}
@media (min-width:761px){.app{padding-bottom:40px}}
.banner{margin:12px 0;padding:12px 14px;border-radius:14px;background:var(--warn-soft);color:var(--warn);font-weight:700}

/* ================= 4. 버튼·입력 ================= */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:10px 18px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--text);font-weight:700;text-decoration:none;line-height:1.2;text-align:center}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger);border-color:var(--danger);background:transparent}
.btn.danger-solid{background:var(--danger);border-color:var(--danger);color:#fff}
[data-theme="dark"] .btn.danger-solid{color:#1a1010}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent)}
.btn.sm{min-height:40px;padding:6px 14px;font-size:.88rem}
.btn.xs{min-height:34px;padding:4px 10px;font-size:.8rem;border-radius:9px}
.btn.big{min-height:56px;font-size:1.05rem;width:100%}
.icon-btn{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:12px;border:1.5px solid transparent;background:transparent;color:var(--muted);font-size:1.15rem;flex:none;padding:0}
button.icon-btn:hover{background:var(--surface-2)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}
.row.center{justify-content:center}
.center-row{display:flex;justify-content:center;margin:22px 0}

input[type=text],input[type=url],input[type=search],input[type=date],input[type=time],input[type=number],select,textarea{width:100%;min-height:50px;padding:10px 14px;border:1.5px solid var(--line);border-radius:12px;background-color:var(--surface);color:var(--text);-webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 55%,calc(100% - 14px) 55%;background-size:6px 6px;background-repeat:no-repeat;padding-right:40px}
input[type=date],input[type=time]{text-align:left}
input::-webkit-date-and-time-value{text-align:left}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
textarea{min-height:120px;resize:vertical;line-height:1.5}
input[type=color]{width:50px;height:50px;padding:4px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer}
input[type=checkbox]{width:24px;height:24px;accent-color:var(--accent);flex:none}
.switch{display:flex;align-items:center;gap:10px;min-height:46px;font-weight:700;cursor:pointer}

/* ================= 5. 목록 화면 ================= */
.toolbar{display:grid;gap:10px;margin:14px 0 6px}
.searchbox{position:relative}
.searchbox svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:20px;height:20px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round}
.searchbox input{padding-left:44px}
.toolrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.toolrow select{flex:1;min-width:11rem;width:auto}
.seg{display:inline-flex;background:var(--surface-2);border-radius:12px;padding:4px;gap:4px;flex-wrap:wrap}
.seg button{border:0;background:transparent;min-height:42px;padding:6px 14px;border-radius:9px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.14)}

.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:8px 0 12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column}
.stat b{font-size:1.5rem;line-height:1.15}
.stat span{font-size:.78rem;color:var(--muted);font-weight:700}
.stat.hot b{color:var(--danger)}

.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin:0 -2px;scrollbar-width:thin;-webkit-overflow-scrolling:touch}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;min-height:42px;padding:6px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--text);font-weight:700;white-space:nowrap}
.chip b{font-weight:800;color:var(--muted);font-size:.85em}
.chip .dot{width:10px;height:10px;border-radius:50%;background:var(--c)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.cat[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:var(--ci)}
.chip[aria-pressed="true"] b{color:inherit;opacity:.85}
.chip.cat[aria-pressed="true"] .dot{background:var(--ci)}

.group h2{display:flex;align-items:center;gap:8px;font-size:1.02rem;margin:22px 0 10px}
.group h2 .count{font-size:.78rem;font-weight:800;background:var(--surface-2);color:var(--muted);border-radius:999px;padding:1px 9px}
.group h2.cg::before{content:"";width:12px;height:12px;border-radius:4px;background:var(--c)}
.group h2.tg-today,.group h2.tg-tomorrow{color:var(--danger)}
.group h2.tg-past,.group h2.tg-nodate{color:var(--muted)}
.list{display:grid;gap:12px}
@media (min-width:761px){.list{grid-template-columns:repeat(2,minmax(0,1fr))}}

.card{position:relative;display:flex;flex-direction:column;gap:5px;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:var(--radius);padding:14px 14px 10px 16px;box-shadow:var(--shadow);cursor:pointer;transition:transform .12s ease}
.card:hover{transform:translateY(-1px)}
.card.dim{opacity:.62}
.card .top{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;padding:2px 10px;border-radius:999px;font-size:.78rem;font-weight:800;background:var(--c,#4b5563);color:var(--ci,#fff);white-space:nowrap}
.status{font-size:.76rem;font-weight:800;padding:2px 9px;border-radius:999px;white-space:nowrap}
.s-interest{background:var(--surface-2);color:var(--muted)}
.s-prep{background:var(--warn-soft);color:var(--warn)}
.s-applied{background:var(--ok-soft);color:var(--ok)}
.s-skip{background:var(--surface-2);color:var(--muted);text-decoration:line-through}
.dday{margin-left:auto;font-weight:900;font-size:.9rem;padding:3px 10px;border-radius:10px;white-space:nowrap}
.dday.urgent{background:var(--danger-soft);color:var(--danger)}
.dday.soon{background:var(--warn-soft);color:var(--warn)}
.dday.later{background:var(--accent-soft);color:var(--accent)}
.dday.past{background:var(--surface-2);color:var(--muted)}
.card h3{margin:2px 0 0;font-size:1.12rem;font-weight:800}
.star{color:#d99a00}
.card .org{color:var(--muted);font-size:.9rem}
.card .when{font-size:.95rem}
.card .when b{display:inline-block;min-width:3.7em;color:var(--muted);font-weight:800;font-size:.85rem}
.card .actions{display:flex;align-items:center;gap:6px;margin-top:4px}
.card .alarm-n{margin-left:auto;color:var(--muted);font-size:.85rem;font-weight:700}
.card .icon-btn.starbtn{font-size:1.4rem;color:#d99a00}

.empty{text-align:center;padding:36px 18px;background:var(--surface);border:1.5px dashed var(--line);border-radius:20px;margin:20px 0}
.empty .big-ico{font-size:3rem;line-height:1.2}
.empty h2{margin:.4rem 0}
.empty p{color:var(--muted)}
.empty.small{padding:22px}
.how{display:grid;gap:10px;text-align:left;max-width:540px;margin:22px auto 0;padding:0 0 0 1.4em}
.how li{color:var(--muted)}
.how li b{color:var(--text)}

/* ================= 6. 달력 ================= */
.cal{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px;box-shadow:var(--shadow);margin-top:6px}
.cal-head{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.cal-head h2{flex:1;text-align:center;margin:0;font-size:1.15rem}
.cal-head .icon-btn{font-size:1.6rem;border-color:var(--line)}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal-wd{text-align:center;font-size:.78rem;font-weight:800;color:var(--muted);padding:2px 0 4px}
.cal-wd.sun{color:var(--danger)} .cal-wd.sat{color:var(--sat)}
.cal-day{display:flex;flex-direction:column;align-items:center;gap:4px;min-height:64px;padding:5px 2px;border-radius:12px;border:2px solid transparent;background:var(--surface-2);color:var(--text);min-width:0;font:inherit}
.cal-day .n{font-weight:800;font-size:.86rem;min-width:1.85em;height:1.85em;display:grid;place-items:center;border-radius:999px}
.cal-day.sun .n{color:var(--danger)} .cal-day.sat .n{color:var(--sat)}
.cal-day.other{opacity:.38}
.cal-day.today .n{background:var(--accent);color:var(--accent-ink)}
.cal-day[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.dots{display:flex;flex-wrap:wrap;justify-content:center;gap:3px;max-width:100%}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.dots i.dl,.lg.dl{border-radius:2px;transform:rotate(45deg) scale(.9)}
.dots em,.evl em{font-style:normal;font-size:.66rem;color:var(--muted);font-weight:800}
.evl{display:none}
@media (min-width:761px){
  .cal-day{min-height:104px;align-items:stretch;padding:6px}
  .cal-day .n{align-self:flex-start}
  .dots{display:none}
  .evl{display:flex;flex-direction:column;gap:3px;min-width:0}
  .evl span{display:block;font-size:.68rem;font-weight:700;padding:1px 6px;border-radius:6px;background:var(--c);color:var(--ci);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}
}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin-top:10px;align-items:center}
.lg{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--muted);margin-right:4px;vertical-align:middle}
.daylist{margin-top:18px}
.daylist h3{margin:0 0 10px;font-size:1.05rem;display:flex;align-items:center;gap:8px;justify-content:space-between;flex-wrap:wrap}
.mini{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:12px 14px;border-radius:14px;border:1px solid var(--line);border-left:6px solid var(--c);background:var(--surface);color:var(--text);margin-bottom:8px;flex-wrap:wrap;font:inherit}
.mini-ref{font-weight:800;font-size:.88rem;color:var(--muted)}
.mini-title{font-weight:800;flex-basis:100%}

/* ================= 7. 패널(알림·설정) ================= */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 18px;margin:16px 0;box-shadow:var(--shadow)}
.panel h2{font-size:1.08rem;margin:0 0 10px}
.panel h2 small{color:var(--muted);font-weight:700;font-size:.8rem}
.facts{margin:0 0 6px;padding-left:1.2em;display:grid;gap:6px}
.callout{margin-top:14px;padding:12px 14px;border-radius:14px;background:var(--accent-soft)}
.plist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.plist li{display:flex;gap:8px 10px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--surface-2);flex-wrap:wrap}
.plist li.clickable{cursor:pointer}
.plist .t{font-weight:800;white-space:nowrap}
.plist .pt{flex-basis:100%;font-weight:700}
.tag{display:inline-block;font-size:.75rem;font-weight:800;padding:1px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.lbl,.field>label{font-weight:800;font-size:.9rem;color:var(--muted)}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:48px;height:48px;border-radius:50%;border:3px solid var(--surface);background:var(--sw);box-shadow:0 0 0 2px var(--line);padding:0}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--text)}
.cat-row{display:grid;grid-template-columns:50px minmax(0,1fr) 44px;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.cat-row .kw{grid-column:1 / -1}
@media (min-width:700px){.cat-row{grid-template-columns:50px 9em minmax(0,1fr) 44px}.cat-row .kw{grid-column:auto;order:3}.cat-row .icon-btn{order:4}}
details.sub{margin:12px 0;border:1.5px solid var(--line);border-radius:14px;padding:10px 14px}
details.sub summary,details.paste summary{font-weight:800;cursor:pointer;min-height:34px;display:flex;align-items:center}
.code{background:var(--surface-2);border-radius:12px;padding:10px 12px;overflow:auto;font-size:.76rem;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-all;margin:8px 0}
.steps{margin:6px 0;padding-left:1.3em;display:grid;gap:4px}

/* ================= 8. 편집 시트·모달 ================= */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(8,12,20,.5);display:flex;align-items:flex-end;justify-content:center;animation:fade .15s ease}
.overlay.center{align-items:center;padding:16px}
#alarm{z-index:60} #ask{z-index:70}
.sheet{width:100%;max-width:760px;max-height:94vh;max-height:94dvh;overflow:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:0 18px;overscroll-behavior:contain;animation:up .2s ease}
@media (min-width:761px){#sheet{align-items:center;padding:20px}.sheet{border-radius:22px;max-height:90vh}}
.sheet-head{position:sticky;top:0;z-index:3;display:flex;align-items:center;justify-content:space-between;background:var(--bg);padding:14px 0 10px;border-bottom:1px solid var(--line);margin:0 0 14px}
.sheet-head h2{margin:0;font-size:1.15rem;outline:none}
.sheet-foot{position:sticky;bottom:0;z-index:3;display:flex;gap:8px;align-items:center;background:var(--bg);border-top:1px solid var(--line);padding:12px 0 calc(12px + env(safe-area-inset-bottom));margin-top:14px}
.sheet-foot .sp{flex:1}
.grid2{display:grid;gap:0 14px}
@media (min-width:620px){.grid2{grid-template-columns:1fr 1fr}}
fieldset.dates{border:1.5px solid var(--line);border-radius:16px;padding:12px 14px 6px;margin:0 0 16px;min-width:0}
fieldset.dates legend{font-weight:800;padding:0 6px;color:var(--muted);font-size:.9rem}
.drow{display:grid;grid-template-columns:5.6em minmax(0,1fr);gap:8px;align-items:center;margin-bottom:10px}
.drow label{font-weight:800;font-size:.92rem}
.dinputs{display:flex;gap:6px;align-items:center;min-width:0}
.dinputs input[type=date]{flex:1.5;min-width:0}
.dinputs input[type=time]{flex:1;min-width:0}
@media (max-width:440px){.drow{grid-template-columns:1fr;gap:4px}}
details.paste{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:16px}
.parse-res{margin-top:6px}
.pr-line{margin:6px 0;font-size:.92rem}
.pr-line.warn{color:var(--warn);font-weight:700}
.dtok{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:8px}
.dtok li{background:var(--surface-2);border-radius:12px;padding:10px 12px}
.dt-main{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dt-ctx{font-size:.8rem;color:var(--muted);margin:2px 0 6px}
.dt-btns{display:flex;gap:6px;flex-wrap:wrap}
.alist{list-style:none;margin:0 0 10px;padding:0;display:grid;gap:6px}
.alist li{display:flex;align-items:center;gap:10px;padding:4px 4px 4px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);min-height:50px}
.alist li .al{font-weight:800}
.alist li .at{color:var(--muted);font-size:.84rem;margin-left:auto;text-align:right}
.alist li.done .al{text-decoration:line-through;color:var(--muted)}
.aadd{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.aadd .a-n{width:5em;flex:none}
.aadd select{width:auto;flex:1;min-width:6.5em}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}

.alarm-box{width:100%;max-width:560px;max-height:90vh;overflow:auto;background:var(--surface);border-radius:22px;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.35);border-top:8px solid var(--accent)}
.alarm-head{display:flex;align-items:center;gap:12px}
.alarm-head h2{margin:0;font-size:1.3rem}
.alarm-head p{margin:2px 0 0}
.bell{font-size:2.1rem;display:inline-block;animation:ring 1s ease 0s 3;transform-origin:50% 10%}
@keyframes ring{0%,100%{transform:rotate(0)}15%{transform:rotate(14deg)}30%{transform:rotate(-12deg)}45%{transform:rotate(9deg)}60%{transform:rotate(-6deg)}75%{transform:rotate(3deg)}}
.alarm-list{list-style:none;margin:14px 0;padding:0;display:grid;gap:10px}
.alarm-item{background:var(--surface-2);border-radius:14px;padding:12px 14px}
.ai-title{font-weight:900;font-size:1.08rem;margin-bottom:4px}
.ai-row{display:flex;gap:6px;flex-wrap:wrap}
.ai-info{margin-top:4px;font-weight:700}
.ask-box{background:var(--surface);border-radius:20px;padding:20px;max-width:460px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.ask-box p{margin:0 0 16px;font-size:1.02rem;white-space:pre-line}
.ask-btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 22px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:80;display:flex;align-items:center;gap:12px;width:max-content;max-width:min(92vw,560px);padding:12px 16px;border-radius:14px;background:#1f2633;color:#fff;box-shadow:0 10px 30px rgba(0,0,0,.3);font-weight:700;animation:fade .15s ease}
[data-theme="dark"] .toast{background:#e8ecf2;color:#11151b}
.toast .btn{min-height:36px;padding:4px 12px;background:transparent;color:inherit;border-color:currentColor;flex:none}
@media (min-width:761px){.toast{bottom:28px}}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(24px);opacity:.6}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">📌</span>
      <div>
        <h1>이벤트 스크랩북</h1>
        <p class="today" id="todayLabel"></p>
      </div>
    </div>
    <nav class="tabs" id="tabs" aria-label="화면 이동">
      <button class="tab" data-view="list"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg><span>목록</span></button>
      <button class="tab" data-view="calendar"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4.5" width="18" height="16.5" rx="2.5"/><path d="M16 2.5v4M8 2.5v4M3 10h18"/></svg><span>달력</span></button>
      <button class="tab tab-add" data-act="add" aria-label="스크랩 추가"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>스크랩</span></button>
      <button class="tab" data-view="alerts"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg><span>알림</span></button>
      <button class="tab" data-view="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg><span>설정</span></button>
    </nav>
  </header>
  <main id="main"></main>
</div>

<div class="overlay" id="sheet" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-head"><h2 id="sheetTitle" tabindex="-1">스크랩 추가</h2><button class="icon-btn" data-act="close" aria-label="닫기">✕</button></div>
    <div id="sheetBody"></div>
    <div class="sheet-foot" id="sheetFoot"></div>
  </div>
</div>
<div class="overlay center" id="alarm" hidden><div class="alarm-box" role="alertdialog" aria-modal="true" aria-labelledby="alarmTitle" id="alarmBox"></div></div>
<div class="overlay center" id="ask" hidden><div class="ask-box" role="dialog" aria-modal="true" aria-labelledby="askMsg"><p id="askMsg"></p><div class="ask-btns" id="askBtns"></div></div></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<noscript><p style="padding:20px">이 페이지는 JavaScript가 켜져 있어야 동작해요.</p></noscript>

<script>
(function () {
  'use strict';

  /* =========================================================
     1. 상수 · 기본값
     ========================================================= */
  const STORE_KEY = 'eventScrapbook.v1';
  const DAY = 86400000;
  const WD = '일월화수목금토';
  const REFS = ['start', 'deadline', 'event', 'eventEnd'];
  const REF_LABEL = { start: '접수 시작', deadline: '마감', event: '행사', eventEnd: '행사 종료', abs: '다시 알림' };
  const REF_SHORT = { start: '시작', deadline: '마감', event: '행사', eventEnd: '종료' };
  const DEFAULT_TIME = { start: '09:00', deadline: '23:59', event: '09:00', eventEnd: '23:59' };
  const UNITS = [{ v: 10080, n: '주' }, { v: 1440, n: '일' }, { v: 60, n: '시간' }, { v: 1, n: '분' }];
  const STATUS = [
    { id: 'interest', name: '관심' },
    { id: 'prep', name: '준비 중' },
    { id: 'applied', name: '신청 완료' },
    { id: 'skip', name: '안 함' }
  ];
  const TIME_GROUPS = [['today', '오늘'], ['tomorrow', '내일'], ['week', '7일 이내'], ['month', '한 달 이내'], ['later', '그 이후'], ['nodate', '날짜 미정'], ['past', '지난 이벤트']];
  const ACCENTS = {
    blue: { name: '파랑', light: '#2456a6', dark: '#7aa7ff' },
    green: { name: '초록', light: '#1e7a5a', dark: '#5fd0a0' },
    purple: { name: '보라', light: '#6b46c1', dark: '#b39cff' },
    orange: { name: '주황', light: '#b8501a', dark: '#ffa06b' },
    pink: { name: '분홍', light: '#b8326a', dark: '#ff8fbf' }
  };
  const FONT_SIZES = [{ name: '보통', px: 17 }, { name: '크게', px: 19 }, { name: '아주 크게', px: 22 }];
  const PALETTE = ['#b45309', '#1d4ed8', '#0f766e', '#6d28d9', '#c2410c', '#be123c', '#4d7c0f', '#0e7490', '#a21caf', '#475569'];
  const DEFAULT_CATS = [
    { id: 'scholar', name: '장학금', color: '#b45309', kw: ['장학', '학자금', '등록금', '생활비'] },
    { id: 'edu', name: '교육', color: '#1d4ed8', kw: ['교육', '강의', '강좌', '세미나', '특강', '워크숍', '워크샵', '부트캠프', '아카데미'] },
    { id: 'training', name: '연수', color: '#0f766e', kw: ['연수', '어학연수', '해외연수', '교환학생', '파견'] },
    { id: 'program', name: '프로그램', color: '#6d28d9', kw: ['프로그램', '서포터즈', '기자단', '멘토링', '멘토', '봉사', '캠프', '인턴', '체험단'] },
    { id: 'contest', name: '공모전', color: '#c2410c', kw: ['공모', '공모전', '아이디어', '수기', '콘테스트', 'UCC'] },
    { id: 'compete', name: '경진대회', color: '#be123c', kw: ['경진대회', '대회', '해커톤', '챌린지', '올림피아드', '경시', '경연'] },
    { id: 'exhibit', name: '전시회', color: '#4d7c0f', kw: ['전시', '전시회', '박람회', '엑스포', 'EXPO', '페어', '쇼케이스', '컨퍼런스', '포럼'] },
    { id: 'etc', name: '기타', color: '#4b5563', kw: [] }
  ];
  const DEFAULT_SETTINGS = {
    theme: 'auto', accent: 'blue', font: 1, sound: true, vibrate: true, groupBy: 'time', view: 'list', notifAsked: false,
    defaultAlarms: [{ ref: 'deadline', offset: 10080 }, { ref: 'deadline', offset: 4320 }, { ref: 'deadline', offset: 1440 }, { ref: 'start', offset: 0 }, { ref: 'event', offset: 1440 }]
  };
  const IMPORT_SAMPLE = '[\n  {\n    "title": "OO재단 장학생 모집",\n    "category": "장학금",\n    "org": "OO재단",\n    "url": "https://example.com/notice/1",\n    "start": "2026-12-01",\n    "deadline": "2026-12-15 18:00",\n    "event": "",\n    "eventEnd": "",\n    "memo": "직전 학기 성적증명서 필요"\n  }\n]';

  /* =========================================================
     2. 작은 도우미 함수
     ========================================================= */
  const $ = (s, r) => (r || document).querySelector(s);
  const $$ = (s, r) => Array.prototype.slice.call((r || document).querySelectorAll(s));
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const pad = (n) => String(n).padStart(2, '0');
  const clone = (o) => JSON.parse(JSON.stringify(o));

  function ymd(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function parseYmd(s) {
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || '');
    if (!m) return null;
    const d = new Date(+m[1], +m[2] - 1, +m[3]);
    return d.getMonth() === +m[2] - 1 ? d : null;
  }
  function validDate(s) { return !!parseYmd(s); }
  function validTime(s) { return /^([01]\d|2[0-3]):[0-5]\d$/.test(s || ''); }
  function startOfDay(ts) { const d = new Date(ts); d.setHours(0, 0, 0, 0); return d.getTime(); }
  function dayDiff(ts, now) { return Math.round((startOfDay(ts) - startOfDay(now)) / DAY); }
  function fmtDay(s, withYear) {
    const d = parseYmd(s);
    if (!d) return '';
    const y = (withYear || d.getFullYear() !== new Date().getFullYear()) ? d.getFullYear() + '.' : '';
    return y + (d.getMonth() + 1) + '.' + d.getDate() + '(' + WD[d.getDay()] + ')';
  }
  function fmtTs(ts) { const d = new Date(ts); return fmtDay(ymd(d)) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()); }
  function todayText() { const d = new Date(); return d.getFullYear() + '년 ' + (d.getMonth() + 1) + '월 ' + d.getDate() + '일 (' + WD[d.getDay()] + ')'; }
  function hexA(hex, a) { const n = parseInt(hex.slice(1), 16); return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')'; }
  function inkFor(hex) {
    const n = parseInt(String(hex).slice(1), 16);
    if (isNaN(n)) return '#fff';
    const L = (0.2126 * ((n >> 16) & 255) + 0.7152 * ((n >> 8) & 255) + 0.0722 * (n & 255)) / 255;
    return L > 0.6 ? '#111111' : '#ffffff';
  }
  function safeUrl(u) {
    u = String(u || '').trim();
    if (!u) return '';
    if (/^https?:\/\//i.test(u)) return u;
    if (/^[a-z][a-z0-9+.\-]*:/i.test(u)) return ''; // javascript: 등 차단
    return 'https://' + u;
  }

  /* =========================================================
     3. 저장 (localStorage)
     ========================================================= */
  function emptyDates() { return { start: { date: '', time: '' }, deadline: { date: '', time: '' }, event: { date: '', time: '' }, eventEnd: { date: '', time: '' } }; }
  function defaultState() {
    return {
      v: 1,
      events: [],
      categories: DEFAULT_CATS.map((c) => ({ id: c.id, name: c.name, color: c.color, kw: c.kw.slice() })),
      settings: Object.assign({}, DEFAULT_SETTINGS, { defaultAlarms: DEFAULT_SETTINGS.defaultAlarms.map((a) => ({ id: uid(), ref: a.ref, offset: a.offset })) }),
      log: []
    };
  }
  function normAlarm(a) {
    if (!a || !REF_LABEL[a.ref] || a.ref === 'eventEnd') return null;
    return { id: String(a.id || uid()), ref: a.ref, offset: Math.max(0, Math.round(Number(a.offset) || 0)), at: Number(a.at) || 0, fired: !!a.fired };
  }
  function normEvent(e) {
    if (!e || typeof e !== 'object') return null;
    const d = emptyDates();
    if (e.dates && typeof e.dates === 'object') {
      REFS.forEach((k) => {
        const x = e.dates[k];
        if (x && validDate(x.date)) { d[k].date = x.date; d[k].time = validTime(x.time) ? x.time : ''; }
      });
    }
    return {
      id: String(e.id || uid()),
      title: String(e.title || '(제목 없음)').slice(0, 200),
      category: String(e.category || 'etc'),
      org: String(e.org || ''),
      url: String(e.url || ''),
      dates: d,
      status: STATUS.some((s) => s.id === e.status) ? e.status : 'interest',
      star: !!e.star,
      memo: String(e.memo || ''),
      raw: String(e.raw || ''),
      demo: !!e.demo,
      alarms: Array.isArray(e.alarms) ? e.alarms.map(normAlarm).filter(Boolean) : [],
      createdAt: Number(e.createdAt) || Date.now(),
      updatedAt: Number(e.updatedAt) || Date.now()
    };
  }
  function migrate(d) {
    const base = defaultState();
    if (!d || typeof d !== 'object') return base;
    const cats = Array.isArray(d.categories) && d.categories.length
      ? d.categories.filter((c) => c && c.name).map((c) => ({ id: String(c.id || uid()), name: String(c.name).slice(0, 20), color: /^#[0-9a-f]{6}$/i.test(c.color) ? c.color : '#4b5563', kw: Array.isArray(c.kw) ? c.kw.map(String).filter(Boolean) : [] }))
      : base.categories;
    if (!cats.some((c) => c.id === 'etc')) cats.push({ id: 'etc', name: '기타', color: '#4b5563', kw: [] });
    const settings = Object.assign({}, base.settings, d.settings && typeof d.settings === 'object' ? d.settings : {});
    settings.defaultAlarms = Array.isArray(settings.defaultAlarms)
      ? settings.defaultAlarms.map(normAlarm).filter((a) => a && a.ref !== 'abs').map((a) => ({ id: a.id, ref: a.ref, offset: a.offset }))
      : base.settings.defaultAlarms;
    if (!ACCENTS[settings.accent]) settings.accent = 'blue';
    settings.font = Number(settings.font);
    if (!FONT_SIZES[settings.font]) settings.font = 1;
    const ids = new Set(cats.map((c) => c.id));
    const events = (Array.isArray(d.events) ? d.events : []).map(normEvent).filter(Boolean);
    events.forEach((e) => { if (!ids.has(e.category)) e.category = 'etc'; });
    return { v: 1, events: events, categories: cats, settings: settings, log: Array.isArray(d.log) ? d.log.filter(Boolean).slice(0, 200) : [] };
  }

  let storageOK = true;
  function load() {
    let s = null;
    try {
      const k = '__t' + Date.now();
      localStorage.setItem(k, '1'); localStorage.removeItem(k);
      s = localStorage.getItem(STORE_KEY);
    } catch (err) { storageOK = false; return defaultState(); }
    if (!s) return defaultState();
    try { return migrate(JSON.parse(s)); }
    catch (err) {
      // 깨진 데이터는 지우지 않고 따로 보관
      try { localStorage.setItem(STORE_KEY + '.broken.' + Date.now(), s); } catch (e2) { /* 무시 */ }
      return defaultState();
    }
  }
  let saveWarned = false;
  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); return true; }
    catch (err) {
      if (!saveWarned) { saveWarned = true; toast('⚠️ 저장하지 못했어요. 이 브라우저에서 저장소(localStorage)를 쓸 수 없거나 꽉 찼어요.', 7000); }
      return false;
    }
  }

  let state = load();
  const ui = {
    view: ['list', 'calendar', 'alerts', 'settings'].indexOf(state.settings.view) >= 0 ? state.settings.view : 'list',
    q: '', cat: 'all', statusFilter: 'active', showPast: false,
    calMonth: new Date(new Date().getFullYear(), new Date().getMonth(), 1),
    calSel: ymd(new Date()),
    editing: null, isNew: false, touched: new Set(), dirty: false, parsed: null
  };

  /* =========================================================
     4. 이벤트 · 날짜 · 알림 계산
     ========================================================= */
  function findEv(id) { return state.events.find((x) => x.id === id); }
  function catOf(id) { return state.categories.find((c) => c.id === id) || state.categories.find((c) => c.id === 'etc') || state.categories[0]; }
  function catStyle(c) { return '--c:' + c.color + ';--ci:' + inkFor(c.color); }
  function statusName(id) { const s = STATUS.find((x) => x.id === id); return s ? s.name : ''; }

  function keyTs(e, ref) {
    const d = e.dates && e.dates[ref];
    if (!d || !d.date) return null;
    const b = parseYmd(d.date);
    if (!b) return null;
    const t = (validTime(d.time) ? d.time : DEFAULT_TIME[ref]).split(':');
    b.setHours(+t[0], +t[1], 0, 0);
    return b.getTime();
  }
  function fmtKey(e, ref) { const d = e.dates[ref]; return d && d.date ? fmtDay(d.date) + (d.time ? ' ' + d.time : '') : ''; }

  // 지금 기준으로 가장 의미 있는 날짜(다가오는 것 우선)
  function primaryKey(e, now) {
    let ks = REFS.map((r) => ({ ref: r, ts: keyTs(e, r) })).filter((k) => k.ts != null);
    if (e.status === 'applied') {
      const ev = ks.filter((k) => k.ref === 'event' || k.ref === 'eventEnd');
      if (ev.length) ks = ev;
    }
    if (!ks.length) return null;
    ks.sort((a, b) => a.ts - b.ts);
    const up = ks.find((k) => k.ts >= now);
    if (up) return { ref: up.ref, ts: up.ts, past: false };
    const last = ks[ks.length - 1];
    return { ref: last.ref, ts: last.ts, past: true };
  }
  function ddayText(ts, now) {
    const dd = dayDiff(ts, now);
    if (ts < now) return dd === 0 ? '오늘(지남)' : 'D+' + (-dd);
    if (dd === 0) {
      const mins = Math.max(1, Math.round((ts - now) / 60000));
      return mins >= 60 ? 'D-DAY · ' + Math.floor(mins / 60) + '시간 남음' : 'D-DAY · ' + mins + '분 남음';
    }
    return 'D-' + dd;
  }
  function urgency(ts, now) { if (ts < now) return 'past'; const dd = dayDiff(ts, now); return dd <= 1 ? 'urgent' : dd <= 7 ? 'soon' : 'later'; }
  function timeGroupOf(p, now) {
    if (!p) return 'nodate';
    if (p.past) return 'past';
    const dd = dayDiff(p.ts, now);
    return dd === 0 ? 'today' : dd === 1 ? 'tomorrow' : dd <= 7 ? 'week' : dd <= 31 ? 'month' : 'later';
  }

  // 날짜만 있고 시간이 없을 때: 'n일 전·당일' 알림은 오전 9시, 'n시간 전' 알림은 기본 시각 기준
  function alarmTs(e, a) {
    if (a.ref === 'abs') return a.at || null;
    const d = e.dates[a.ref];
    if (!d || !d.date) return null;
    if (!d.time && a.offset % 1440 === 0) {
      const b = parseYmd(d.date);
      if (!b) return null;
      b.setHours(9, 0, 0, 0);
      return b.getTime() - a.offset * 60000;
    }
    const k = keyTs(e, a.ref);
    return k == null ? null : k - a.offset * 60000;
  }
  function alarmActive(e, a) {
    if (e.status === 'skip') return false;
    if (e.status === 'applied' && (a.ref === 'start' || a.ref === 'deadline')) return false;
    return true;
  }
  function offsetLabel(min) {
    if (!min) return '당일';
    for (let i = 0; i < UNITS.length; i++) if (min % UNITS[i].v === 0) return (min / UNITS[i].v) + UNITS[i].n + ' 전';
    return min + '분 전';
  }
  function alarmLabel(a) { return a.ref === 'abs' ? '다시 알림' : REF_LABEL[a.ref] + ' ' + offsetLabel(a.offset); }
  function refreshAlarmFlags(e) {
    const now = Date.now();
    e.alarms.forEach((a) => { const t = alarmTs(e, a); a.fired = t != null && t <= now; });
    e.alarms = e.alarms.filter((a) => !(a.ref === 'abs' && a.fired));
  }
  function newEvent() {
    return {
      id: uid(), title: '', category: 'etc', org: '', url: '', dates: emptyDates(), status: 'interest', star: false, memo: '', raw: '', demo: false,
      alarms: state.settings.defaultAlarms.map((a) => ({ id: uid(), ref: a.ref, offset: a.offset, at: 0, fired: false })),
      createdAt: Date.now(), updatedAt: Date.now()
    };
  }

  /* =========================================================
     5. 스크랩 자동 인식 (붙여넣은 공고 텍스트 → 제목·링크·날짜·분야)
     ========================================================= */
  const RX = {
    url: /https?:\/\/[^\s<>"'`)\]}]+/g,
    p1: /(^|[^\d])((?:19|20)\d{2})\s*(?:[.\-\/]|년)\s*(\d{1,2})\s*(?:[.\-\/]|월)\s*(\d{1,2})(?!\d)\s*(?:일)?/g,     // 2026.12.1 / 2026-12-01 / 2026년 12월 1일

  function viewCalendar() {

      '<div class="cal-grid">' + WD.split('').map((w, i) => '<div class="cal-wd ' + (i === 0 ? 'sun' : i === 6 ? 'sat' : '') + '">' + w + '</div>').join('') + cells + '</div>' +

      '<section class="daylist"><h3><span>' + (selD ? (selD.getMonth() + 1) + '월 ' + selD.getDate() + '일 (' + WD[selD.getDay()] + ')' : '') + ' · ' + dayItems.length + '건</span><button class="btn sm" data-act="addOnDay">＋ 이 날 마감으로 추가</button></h3>' +
      (dayItems.length ? dayItems.map(miniHtml).join('') : '<p class="muted">이 날짜의 일정이 없어요.</p>') + '</section>';
  }

  let sysNotifBroken = false;
  function notifStatus() {
    if (!('Notification' in window)) return { text: '이 브라우저는 지원하지 않아요 (화면 알림으로 대신해요)', canAsk: false };

    const p = Notification.permission;
    if (p === 'granted') return { text: '허용됨', canAsk: false };
    if (p === 'denied') return { text: '차단됨 — 브라우저의 사이트 설정에서 바꿀 수 있어요', canAsk: false };
    return { text: window.isSecureContext ? '아직 묻지 않음' : '아직 묻지 않음 (파일로 열었거나 https가 아니면 막힐 수 있어요)', canAsk: true };

  function upcomingAlarms(limit) {

      const t = alarmTs(e, a);
      if (t != null && t > now) list.push({ e: e, a: a, t: t });
    }));
    return list.sort((x, y) => x.t - y.t).slice(0, limit);
  }

  function alarmEditorInner(alarms, e) {
    const now = Date.now();
    const list = alarms.filter((a) => a.ref !== 'abs').slice().sort((a, b) => REFS.indexOf(a.ref) - REFS.indexOf(b.ref) || b.offset - a.offset);
    const rows = list.map((a) => {
      let info = '', cls = '';
      if (e) {
        const t = alarmTs(e, a);
        if (t == null) info = REF_LABEL[a.ref] + ' 날짜 없음';
        else if (!alarmActive(e, a)) info = '진행 상태 때문에 쉬는 중';
        else if (t <= now) { info = fmtTs(t) + ' (지남)'; cls = 'done'; }
        else info = fmtTs(t);
      }
      return '<li class="' + cls + '"><span class="al">' + esc(alarmLabel(a)) + '</span><span class="at">' + esc(info) + '</span><button type="button" class="icon-btn" data-act="delAlarm" data-v="' + esc(a.id) + '" aria-label="' + esc(alarmLabel(a)) + ' 알림 삭제">✕</button></li>';
    }).join('');
    return '<ul class="alist">' + (rows || '<li><span class="muted">알림 없음</span></li>') + '</ul>' +
      '<div class="aadd"><select class="a-r" aria-label="기준 날짜">' + ['deadline', 'start', 'event'].map((r) => '<option value="' + r + '">' + REF_LABEL[r] + '</option>').join('') + '</select>' +
      '<input class="a-n" type="number" min="0" max="999" value="1" inputmode="numeric" aria-label="얼마나 전">' +
      '<select class="a-u" aria-label="단위">' + UNITS.map((u) => '<option value="' + u.v + '"' + (u.v === 1440 ? ' selected' : '') + '>' + u.n + ' 전</option>').join('') + '</select>' +
      '<button type="button" class="btn sm" data-act="addAlarm">추가</button></div>' +

      case 'calPrev': ui.calMonth = new Date(ui.calMonth.getFullYear(), ui.calMonth.getMonth() - 1, 1); render(); break;
      case 'calNext': ui.calMonth = new Date(ui.calMonth.getFullYear(), ui.calMonth.getMonth() + 1, 1); render(); break;
      case 'calToday': d = new Date(); ui.calMonth = new Date(d.getFullYear(), d.getMonth(), 1); ui.calSel = ymd(d); render(); break;
      case 'calSel': {
        ui.calSel = v;
        const sd = parseYmd(v);
        if (sd && (sd.getMonth() !== ui.calMonth.getMonth() || sd.getFullYear() !== ui.calMonth.getFullYear())) ui.calMonth = new Date(sd.getFullYear(), sd.getMonth(), 1);
        render();
        const dl = $('.daylist');
        if (dl && dl.getBoundingClientRect().top > window.innerHeight - 140) dl.scrollIntoView({ behavior: 'smooth', block: 'start' });
        break;
      }
      case 'addOnDay': openEditor(null, { dates: { deadline: { date: ui.calSel, time: '' } } }); break;
      case 'reqNotif': requestNotif(); break;
      case 'testAlarm': testAlarm(); break;
      case 'ics': exportICS(); break;
      case 'clearLog': state.log = []; save(); render(); break;
      case 'theme': state.settings.theme = v; save(); applyTheme(); render(); break;
      case 'accent': state.settings.accent = v; save(); applyTheme(); render(); break;
      case 'font': state.settings.font = Number(v); save(); applyTheme(); render(); break;
      case 'addCat': {
        const used = new Set(state.categories.map((c) => c.color));
        const color = PALETTE.find((p) => !used.has(p)) || PALETTE[state.categories.length % PALETTE.length];
        const ei = state.categories.findIndex((c) => c.id === 'etc');
        const at = ei < 0 ? state.categories.length : ei;
        state.categories.splice(at, 0, { id: uid(), name: '새 분야', color: color, kw: [] });
        save(); render();
        setTimeout(() => { const r = $$('.cat-row')[at]; const inp = r && r.querySelector('[data-cf="name"]'); if (inp) { inp.focus(); inp.select(); } }, 50);
        break;
      }
      case 'delCat': delCat(v); break;
      case 'exportJson': download('event-scrapbook-backup-' + ymd(new Date()).replace(/-/g, '') + '.json', JSON.stringify(state, null, 2), 'application/json'); toast('백업 파일을 내려받았어요'); break;
      case 'importFile': { const f = $('#importFile'); if (f) f.click(); break; }
      case 'importText': {
        const ta = $('#importText');
        if (!ta || !ta.value.trim()) { toast('붙여넣은 내용이 없어요'); break; }
        importFromText(ta.value);
        break;
      }
      case 'wipe':
        confirmDlg('이벤트 ' + state.events.length + '개와 알림 기록을 모두 지울까요?\n분야·화면 설정은 남아요. 되돌릴 수 없으니 먼저 백업을 권해요.', '모두 삭제', true).then((ok) => {
          if (!ok) return;
          state.events = []; state.log = [];
          save(); render(); toast('모두 지웠어요');
        });
        break;
      case 'copyBm': copyText(bookmarkletHref()); break;
      case 'snooze': snooze(+el.dataset.i, v); break;
      case 'alarmOk': closeAlarm(); break;
      default: break;
    }
  }

  document.addEventListener('pointerdown', unlockAudio, { passive: true });
  document.addEventListener('click', (ev) => {
    const bm = ev.target.closest('[data-bm]');
    if (bm) { ev.preventDefault(); toast('이 버튼은 누르지 말고 북마크바로 끌어다 놓으세요', 4000); return; }
    const nav = ev.target.closest('[data-view]');
    if (nav) { setView(nav.dataset.view); return; }
    if (ev.target.closest('a[href]')) return; // 링크는 그대로 열기
    const el = ev.target.closest('[data-act]');
    if (!el) return;
    handleAct(el.dataset.act, el, ev);
  });
  let parseTimer = null;
  document.addEventListener('input', (ev) => {
    const t = ev.target;
    if (t.id === 'q') { ui.q = t.value; renderListBody(); return; }
    if (t.closest && t.closest('#sheet')) {
      ui.dirty = true;
      if (t.dataset.f) ui.touched.add(t.dataset.f);
      if (t.id === 'rawIn') { clearTimeout(parseTimer); parseTimer = setTimeout(() => runParse(false), 350); }
      if (t.type === 'date' || t.type === 'time') { syncFormToEditing(); rerenderEditorAlarms(); }
    }
  });
  document.addEventListener('change', (ev) => {
    const t = ev.target;
    if (t.id === 'statusFilter') { ui.statusFilter = t.value; renderListBody(); return; }
    if (t.id === 'importFile') {
      const f = t.files && t.files[0];
      if (!f) return;
      const rd = new FileReader();
      rd.onload = () => { importFromText(String(rd.result)); t.value = ''; };
      rd.onerror = () => toast('파일을 읽지 못했어요');
      rd.readAsText(f);
      return;
    }
    if (t.dataset && t.dataset.set) { state.settings[t.dataset.set] = t.checked; save(); return; }
    if (t.dataset && t.dataset.cf) {
      const row = t.closest('.cat-row');
      const c = row && state.categories.find((x) => x.id === row.dataset.cid);
      if (!c) return;
      if (t.dataset.cf === 'name') { const nv = t.value.trim(); if (nv) c.name = nv.slice(0, 20); else t.value = c.name; }
      else if (t.dataset.cf === 'color') c.color = /^#[0-9a-f]{6}$/i.test(t.value) ? t.value : c.color;
      else if (t.dataset.cf === 'kw') c.kw = t.value.split(/[,，\n]/).map((s) => s.trim()).filter(Boolean);
      save();
      return;
    }
    if (t.closest && t.closest('#sheet') && (t.type === 'date' || t.type === 'time')) { syncFormToEditing(); rerenderEditorAlarms(); }
  });
  document.addEventListener('keydown', (ev) => {
    if (ev.key === 'Escape') {
      if (!$('#ask').hidden) { if (askCancel) askCancel(); }
      else if (!$('#alarm').hidden) closeAlarm();
      else if (!$('#sheet').hidden) closeEditor();
      return;
    }
    if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.matches && ev.target.matches('[role="button"][data-act="edit"]')) {
      ev.preventDefault();
      openEditor(ev.target.dataset.id);
    }
  });

  /* =========================================================
     16. 시작
     ========================================================= */
  function handleHash() {
    const h = location.hash || '';
    if (h.indexOf('#scrap=') !== 0) return;
    try {
      const o = JSON.parse(decodeURIComponent(h.slice(7)));
      try { history.replaceState(null, '', location.pathname + location.search); } catch (err) { /* 무시 */ }
      openEditor(null, { text: '제목: ' + (o.t || '') + '\nURL: ' + (o.u || '') + '\n\n' + (o.s || '') });
    } catch (err) { toast('스크랩 정보를 읽지 못했어요'); }
  }
  if (window.matchMedia) {
    const mq = window.matchMedia('(prefers-color-scheme: dark)');
    const h = () => { if (state.settings.theme === 'auto') applyTheme(); };
    if (mq.addEventListener) mq.addEventListener('change', h); else if (mq.addListener) mq.addListener(h);
  }
  window.addEventListener('hashchange', handleHash);
  window.addEventListener('focus', checkAlarms);
  window.addEventListener('storage', (ev) => {
    if (ev.key !== STORE_KEY || !ev.newValue) return;
    try { state = migrate(JSON.parse(ev.newValue)); applyTheme(); if ($('#sheet').hidden) render(); } catch (err) { /* 무시 */ }
  });
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { stopFlash(); checkAlarms(); tick(); } });

  applyTheme();
  $('#todayLabel').textContent = todayText();
  render();
  handleHash();
  setTimeout(checkAlarms, 800);
  setInterval(checkAlarms, 20000);
  setInterval(tick, 60000);

  // 점검용(콘솔에서 사용 가능)
  window.__scrapbook = { parseScrap: parseScrap, buildICS: buildICS, checkAlarms: checkAlarms, getState: () => state };
})();
</script>
</body>
</html>
